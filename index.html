<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20495f" />
    <script>
      (() => {
        let choice;
        try { choice = localStorage.getItem("mars-theme-v1"); } catch {}
        const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#132c3a" : "#20495f";
        document.querySelector('meta[name="theme-color"]').content = root.style.backgroundColor;
      })();
    </script>
    <meta name="description" content="Jova’ Kind — CS Major at Howard University, expected 2028." />
    <title>Jova’ Kind</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to view the ASCII fish animation.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
